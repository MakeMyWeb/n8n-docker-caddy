version: "3.7"

services:
  caddy:
    image: caddy:latest
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      # Consumed by the {$VAR} substitutions in caddy_config/Caddyfile, which
      # Caddy expands itself when it parses the config — hence they must be in
      # this container's environment, not just in Compose's.
      - DOMAIN_NAME=${DOMAIN_NAME}
      - SUBDOMAIN=${SUBDOMAIN}
      - SSL_EMAIL=${SSL_EMAIL}
    volumes:
      # TLS certificates and the ACME account key. Precious — back it up.
      - caddy_data:/data
      # Caddy's own autosave.json. Derived from the Caddyfile, disposable.
      # A named volume rather than a bind mount, so the container cannot write
      # root-owned files into the git working tree.
      - caddy_config:/config
      # Our Caddyfile, read-only. The whole directory is mounted rather than the
      # single file: a bind mount of a file pins an inode, and `git pull`
      # replaces the file with a new one, so the container would keep serving
      # the old config until forcibly recreated.
      - ./caddy_config:/etc/caddy:ro

  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h localhost -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

  n8n:
    image: docker.n8n.io/n8nio/n8n
    restart: always
    ports:
      - 5678:5678
    environment:
      - N8N_HOST=${SUBDOMAIN}.${DOMAIN_NAME}
      - N8N_PORT=5678
      - N8N_PROTOCOL=https
      - NODE_ENV=production
      - WEBHOOK_URL=https://${SUBDOMAIN}.${DOMAIN_NAME}/
      - GENERIC_TIMEZONE=${GENERIC_TIMEZONE}
      - N8N_TRUST_PROXY=true
      - NODE_OPTIONS="--dns-result-order=ipv4first"
      - N8N_DATA_TABLES_MAX_SIZE_BYTES=${N8N_DATA_TABLES_MAX_SIZE_BYTES:-500000000}
      - N8N_PROXY_HOPS=1
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=${POSTGRES_DB}
      - DB_POSTGRESDB_USER=${POSTGRES_USER}
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - n8n_data:/home/node/.n8n
      - ${DATA_FOLDER}/local_files:/files
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  caddy_data:
    external: true
  n8n_data:
    external: true
  postgres_data:
    external: true
  # Disposable, so this one is a regular project-scoped volume.
  caddy_config: {}
